server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    # Enable Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml image/png image/jpeg;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser caching for images (30 Days)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Browser caching for CSS and JS (7 Days)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
