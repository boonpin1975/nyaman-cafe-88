version: '3.8'

services:
  nyaman-cafe-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyaman_cafe_88_app
    ports:
      - "8080:80"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
